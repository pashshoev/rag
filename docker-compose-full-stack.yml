# All-in-Docker demo: API + Qdrant + Ollama + UI (Ollama = CPU on Mac Docker Desktop)
#   make run-full
# Prefer default `make run` (docker-compose.yml) for host Ollama / Apple GPU.
# Model pull happens via the one-shot `ollama-pull` service (reads LLM_MODEL from .env).

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: download LLM_MODEL into the shared ollama_data volume, then exit.
  # Not baked into the image — weights stay on the volume across restarts.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${LLM_MODEL:-llama3.2:1b}"]
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      CORPUS_DIR: /app/data/corpus
      QDRANT_COLLECTION: wikipedia
      EMBEDDING_BACKEND: in_process
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    volumes:
      - hf_cache:/cache/huggingface
      - ./data/corpus:/app/data/corpus:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  hf_cache:
  ollama_data:
