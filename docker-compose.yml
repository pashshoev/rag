# Default local stack: API + UI + Qdrant
# LLM runs on the host (native Ollama → Apple GPU). See docs/ollama.md
#   make run

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      CORPUS_DIR: /app/data/corpus
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-wikipedia}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-in_process}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/cache/huggingface
      - ./data/corpus:/app/data/corpus:ro
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  hf_cache:
