[project]
name = "rag"
version = "0.1.0"
description = "Minimal local RAG MVP: chunk, embed, retrieve (Qdrant), generate (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.32", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: hits network or downloads models",
]
